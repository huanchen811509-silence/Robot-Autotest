spring:
  application:
    name: robot-autotest
  profiles:
    default: dev
  lifecycle:
    # 与 server.shutdown=graceful 配合：停机时给在途请求与异步队列留出排空时间（EW32-04）
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:robot_dev}
    # 用户名给默认值、口令不给：缺 DB_PASSWORD 时启动即失败，且报错里带变量名（FR-v0.1-07）
    username: ${DB_USERNAME:robot}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # EW32-10 容量压测：8 条连接时 20 并发读 p95=155ms、运行创建 p95=688ms，
      # 50/100 并发呈线性劣化（队列全压在连接池上）。默认提到 16 并可用环境变量调；
      # 单实例 16 条，多实例部署时按 DB 的 max_connections 重新核算。
      maximum-pool-size: ${DB_POOL_SIZE:16}
      connection-timeout: 5000
  flyway:
    # 迁移由 make db-migrate（mvn flyway:migrate）执行，不跟应用启动绑死
    enabled: false
    locations: filesystem:${DB_MIGRATION_PATH:../db/migration}

server:
  port: ${SERVER_PORT:8081}
  # 优雅停机：先停止接新请求，等在途请求与异步排空后再退出
  shutdown: graceful

logging:
  level:
    com.qa.autotest: INFO
  pattern:
    # traceId 由 TraceIdFilter 写入 MDC；异步任务由 BoundedExecutor 透传（EW32-07）
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [%X{traceId:-}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        # 只开健康、信息、指标；不暴露 env/heapdump 等敏感端点
        include: health,info,metrics
  endpoint:
    health:
      probes:
        # /actuator/health/liveness 与 /actuator/health/readiness
        enabled: true
      show-details: never
  metrics:
    tags:
      application: robot-autotest

execution:
  # EW32-05：请求指纹幂等（Header 优先）；关闭即回退随机请求号
  idempotency-fingerprint-enabled: ${EXECUTION_IDEMPOTENCY_FINGERPRINT:true}
  idempotency-window-seconds: ${EXECUTION_IDEMPOTENCY_WINDOW_SECONDS:120}
  # EW32-05：孤儿进程周期清扫；interval=0 关闭
  orphan-sweep-interval-seconds: ${EXECUTION_ORPHAN_SWEEP_SECONDS:60}
  orphan-min-age-seconds: ${EXECUTION_ORPHAN_MIN_AGE_SECONDS:30}

app:
  cache:
    # EW32-03：关闭后所有读路径回源，用于「关缓存等价」回归
    enabled: ${APP_CACHE_ENABLED:true}
    ttl-seconds: ${APP_CACHE_TTL_SECONDS:30}
    max-entries: ${APP_CACHE_MAX_ENTRIES:512}
  async:
    # EW32-04：审计写入的有界池；队列满降级同步，停机排空
    core-size: ${APP_ASYNC_CORE:2}
    max-size: ${APP_ASYNC_MAX:4}
    queue-capacity: ${APP_ASYNC_QUEUE:1024}
    shutdown-timeout-seconds: ${APP_ASYNC_SHUTDOWN_SECONDS:10}
  workspace:
    # v4.1 工作区：项目级导出/导入的根目录、配额与签名密钥（ADR-4X-12/15）
    root: ${WORKSPACE_ROOT:./workspace}
    signing-key: ${WORKSPACE_SIGNING_KEY:}
    max-files: ${WORKSPACE_MAX_FILES:20000}
    max-bytes: ${WORKSPACE_MAX_BYTES:536870912}
    max-file-bytes: ${WORKSPACE_MAX_FILE_BYTES:2097152}
    timeout-seconds: ${WORKSPACE_TIMEOUT_SECONDS:300}

report:
  retention:
    # 破坏性操作默认关闭；测试环境不配置即不会触发任何真实删除（RPT-06）
    enabled: false
    cron: "0 3 * * *"
    max-days: 90
    max-project-gb: 50
    keep-recent-runs: 20
  export:
    # 打印页前端基址（Vite dev）；无头浏览器从这里加载 /reports/:runId/print?token=...
    print-base-url: ${REPORT_PRINT_BASE_URL:http://127.0.0.1:5173}
    # 空 = 按 REPORT_PDF_CHROME → Windows Chrome → Windows Edge → google-chrome → chromium 探测
    chrome-executable: ${REPORT_PDF_CHROME:}
    # DEV-PLAN §5：单次打印超时 90 秒
    timeout-seconds: 90

ci:
  # 同一项目 API token 每分钟触发上限，超出返回 429（PLN-03）
  trigger-per-minute: ${CI_TRIGGER_PER_MINUTE:10}
  trigger-window-seconds: 60
  writeback:
    # 默认关闭；开启后还需环境变量 GITHUB_STATUS_TOKEN（令牌只从环境读取，不落配置文件）
    enabled: ${CI_WRITEBACK_ENABLED:false}
    api-base-url: ${CI_WRITEBACK_API_BASE_URL:https://api.github.com}
    # 报告页基址：target_url = 该值 + /reports/{runId}
    target-base-url: ${CI_WRITEBACK_TARGET_BASE_URL:http://127.0.0.1:5173}
    context: ${CI_WRITEBACK_CONTEXT:qa-platform/ci}
    timeout-seconds: 10
