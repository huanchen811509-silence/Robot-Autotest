name: PR

# 质量门（lint → test → build）。
#
# 运行器变更（2026-11-21）：
#   原配置写死 `runs-on: [self-hosted, linux, x64, rf-lab]`，但该 runner 从未在本仓库注册
#   （2026-11-19/20 多次运行均排队到 24h 后被取消，形如 24h0m2s 的耗时记录）。
#   门禁一旦永远排队，"CI 绿"就无从谈起，冲突也拦不住。改为 GitHub 托管 ubuntu-latest：
#   - 数据库用一次性 MariaDB 容器（与 ADR-0002 的机器人库同版本线），口令每次随机生成、
#     只活在本 job 的 $GITHUB_ENV 里，仓库不留明文（满足 AGENTS.md §9）；
#   - 集成测试（@Tag("it")）照旧由 `scripts/test.sh` 在 DB_PASSWORD 非空时自动追加，
#     不额外开关，避免"CI 里悄悄不跑 IT"。
#   全量门禁仍在 WSL 权威副本执行；本流水线只守 lint / 单测 / ArchUnit / IT / 构建。

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

# 同一分支的重复推送取消旧流水线，省 runner
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_NAME: robot_it
  DB_USERNAME: robot
  # 不在这里取 secrets.DB_PASSWORD：CI 的库是一次性容器，口令由 job 内随机生成后写入
  # $GITHUB_ENV。留在 workflow 顶层反而会出现"应用口令与容器口令不一致"的半配置状态。

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # tools/check_*.py 里只有 check_import_header / subset_font 需要第三方包，清单在仓库里。
      - name: Python 守门依赖
        run: python3 -m pip install --disable-pip-version-check -r tools/requirements.txt
      - run: make lint

  test:
    name: test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 上下文级 E2E（如 RunLogWebSocketE2ETest）会拉起完整 ApplicationContext，
      # 其中 SecretCipher 强校验 CRED_MASTER_KEY（32 字节 base64）。开发机写在
      # ~/.config/robot-autotest/env 里；CI 每次随机生成——只用于本进程内加解密，
      # 不落盘、不外传，也不进仓库（2026-11-21 首跑即因缺它 4 条 E2E 报错）。
      - name: 生成一次性凭据主密钥
        run: echo "CRED_MASTER_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # 一次性库：容器随 job 销毁，口令随机生成只写进 $GITHUB_ENV。
      # 不用 services: 是因为服务容器在 secrets.DB_PASSWORD 为空时会以空口令启动失败，
      # 而本仓库该 secret 是否配置不保证；docker run 能把两种情形都收敛成"有库"。
      - name: 启动一次性 MariaDB
        run: |
          set -euo pipefail
          pw="$(openssl rand -hex 16)"
          docker run -d --name ci-mariadb -p 3306:3306 \
            -e MARIADB_ROOT_PASSWORD="$pw" \
            -e MARIADB_DATABASE=robot_it \
            -e MARIADB_USER=robot \
            -e MARIADB_PASSWORD="$pw" \
            mariadb:10.11
          for _ in $(seq 1 60); do
            if docker exec ci-mariadb mariadb -urobot -p"$pw" -e 'SELECT 1' >/dev/null 2>&1; then
              echo "DB_PASSWORD=$pw" >> "$GITHUB_ENV"
              echo "[ci] MariaDB 就绪（robot_it）"
              exit 0
            fi
            sleep 2
          done
          echo "[ci] MariaDB 90s 内未就绪" >&2
          docker logs --tail 40 ci-mariadb >&2 || true
          exit 1

      # 容器每次都是新建的，库与数据天然干净——等价于 db-reset，且不依赖交互确认。
      - name: 迁移到最新
        run: make db-migrate

      # 含 ArchUnit + @Tag("it") 集成测试；集成测试串行（同库互斥）
      - run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            artifacts/*.log
            backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
      - name: 收尾（停容器）
        if: always()
        run: docker rm -f ci-mariadb || true

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            backend/target/*.jar
            frontend/dist/
          if-no-files-found: error
          retention-days: 14
